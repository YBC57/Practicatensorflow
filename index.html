
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <title>Reconocimiento de señas LSM</title>
</head>

<body>

    <h2>Imagen Estática</h2>

    <img
        crossOrigin="anonymous"
        src="https://picsum.photos/200/300?random=0"
        width="227"
        height="227"
        id="img"
    >

    <br>

    <button onclick="cambiarImagen();">
        Cambiar imagen
    </button>

    <div id="descripcion_imagen"></div>

    <br>
    <hr>
    <br>

    <h2>Cámara Web y Reconocimiento de Señas</h2>

    <video
        autoplay
        playsinline
        muted
        width="227"
        height="227"
        id="webcam"
    ></video>

    <p id="estadoReconocimiento">
        Cargando modelo...
    </p>

    <h3>Predicción MobileNet</h3>
    <div id="console"></div>

    <h3>Letra reconocida automáticamente</h3>
    <div id="letraActual">
        Esperando una seña...
    </div>

    <hr>

    <h2>Palabra formada</h2>

    <h1 id="palabra">
        _
    </h1>

    <button onclick="borrarPalabra();">
        Borrar palabra
    </button>

    <script src="js/scripts.js"></script>

</body>
</html>
