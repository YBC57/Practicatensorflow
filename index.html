
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <title>Clasificador de Señas</title>
</head>
<body>
    <h1>Clasificador de Señas</h1>

    <p id="estado">Cargando modelo...</p>

    <h2>Cámara web</h2>
    <video autoplay playsinline muted
           width="320" height="240" id="webcam"></video>

    <h2>Predicción MobileNet</h2>
    <div id="console"></div>

    <h2>Reconocimiento de señas</h2>
    <div id="console2">Esperando ejemplos...</div>

    <h3>Entrenar clasificador</h3>
    <p>Coloca tu mano frente a la cámara y captura varios ejemplos de cada seña.</p>

    <button onclick="addExample(0)">Guardar seña A</button>
    <button onclick="addExample(1)">Guardar seña B</button>
    <button onclick="addExample(2)">Guardar seña C</button>

    <div id="ejemplos"></div>

    <h3>Formar una palabra</h3>
    <div>
        <strong>Palabra:</strong>
        <span id="palabra"></span>
    </div>

    <button onclick="agregarLetra()">Agregar letra reconocida</button>
    <button onclick="borrarUltima()">Borrar última letra</button>
    <button onclick="limpiarPalabra()">Limpiar palabra</button>

    <script src="js/scripts.js"></script>
</body>
</html>
